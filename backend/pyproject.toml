[project]
name = "similia-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langchain-voyageai>=0.4.1",
    "langgraph>=1.2.18",
    "langsmith>=0.14.16",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "strawberry-graphql[fastapi]>=0.339.0",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.3.7",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
